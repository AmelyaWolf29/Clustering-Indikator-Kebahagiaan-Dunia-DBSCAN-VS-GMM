<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}WHR 2024 — DBSCAN vs GMM{% endblock %}</title>
  <style>
    :root {
      --primary: #1565C0;
      --primary-light: #1976D2;
      --accent: #FF5722;
      --accent2: #4CAF50;
      --bg: #F5F7FA;
      --card: #ffffff;
      --text: #212121;
      --text-muted: #757575;
      --border: #E0E0E0;
      --dbscan: #2196F3;
      --gmm: #FF5722;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* Navigation */
    nav {
      background: var(--primary);
      display: flex; align-items: center;
      padding: 0 24px; height: 58px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .nav-logo .logo-circle {
      width:34px; height:34px; border-radius:50%;
      background:#fff; display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--primary); font-size:13px;
    }
    .nav-logo span { color:#fff; font-weight:700; font-size:15px; }
    .nav-links { margin-left:auto; display:flex; gap:4px; }
    .nav-links a {
      color:rgba(255,255,255,.82); text-decoration:none;
      padding:7px 16px; border-radius:6px; font-size:14px;
      transition:background .2s;
    }
    .nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.18); color:#fff; }

    /* Page Wrapper */
    .page { max-width:1200px; margin:0 auto; padding:28px 20px 60px; }

    /* Cards */
    .card {
      background:var(--card); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:24px; margin-bottom:20px;
    }
    .card-title { font-size:15px; font-weight:700; color:var(--primary); margin-bottom:14px; }

    /* Badge */
    .badge {
      display:inline-block; padding:3px 10px; border-radius:20px;
      font-size:12px; font-weight:600;
    }
    .badge-db { background:#E3F2FD; color:var(--dbscan); }
    .badge-gmm { background:#FBE9E7; color:var(--gmm); }
    .badge-ok { background:#E8F5E9; color:#2E7D32; }
    .badge-warn{ background:#FFF3E0; color:#E65100; }

    /* Metric Grid */
    .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
    .metric-item { text-align:center; padding:14px 10px; border-radius:8px; background:var(--bg); }
    .metric-item .val { font-size:22px; font-weight:800; }
    .metric-item .lbl { font-size:11px; color:var(--text-muted); margin-top:3px; }
    .val-db { color:var(--dbscan); }
    .val-gmm { color:var(--gmm); }

    /* Table */
    .tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .tbl th { background:var(--primary); color:#fff; padding:9px 12px; text-align:left; }
    .tbl td { padding:8px 12px; border-bottom:1px solid var(--border); }
    .tbl tr:hover td { background:#F3F8FF; }
    .tbl .better { color:#2E7D32; font-weight:700; }

    /* Plot Image */
    .plot-img { width:100%; border-radius:8px; border:1px solid var(--border); margin-top:10px; }

    /* Buttons */
    .btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:10px 22px; border-radius:7px; border:none;
      font-size:14px; font-weight:600; cursor:pointer; transition:.2s;
      text-decoration:none;
    }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-light); }
    .btn-accent { background:var(--accent); color:#fff; }
    .btn-outline { background:transparent; border:2px solid var(--primary); color:var(--primary); }
    .btn-outline:hover { background:var(--primary); color:#fff; }

    /* Form */
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--primary); }
    .form-control {
      width:100%; padding:9px 12px; border:1.5px solid var(--border);
      border-radius:7px; font-size:14px; transition:.2s;
    }
    .form-control:focus { border-color:var(--primary); outline:none; }

    /* Spinner */
    .spinner { display:none; text-align:center; padding:40px; }
    .spinner .spin {
      width:44px; height:44px; border:4px solid var(--border);
      border-top-color:var(--primary); border-radius:50%;
      animation:spin .8s linear infinite; margin:0 auto 12px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Section Header */
    .section-header {
      display:flex; align-items:center; gap:10px;
      font-size:17px; font-weight:800; color:var(--primary);
      margin-bottom:18px; padding-bottom:10px;
      border-bottom:2px solid var(--primary);
    }

    /* Anomali Chip */
    .anomali-chip {
      display:inline-block; margin:3px; padding:4px 10px;
      border-radius:20px; font-size:12px; font-weight:600;
    }
    .chip-senang { background:#E8F5E9; color:#2E7D32; }
    .chip-sedih { background:#FFEBEE; color:#C62828; }
    .chip-korupsi { background:#FFF3E0; color:#E65100; }
    .chip-bersih { background:#EDE7F6; color:#4527A0; }
    .chip-dermawan { background:#E3F2FD; color:#0D47A1; }
    .chip-pelit { background:#FCE4EC; color:#880E4F; }

    footer {
      text-align:center; padding:20px; color:var(--text-muted);
      font-size:12px; border-top:1px solid var(--border);
      margin-top:40px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-logo" href="/">
    <div class="logo-circle">WHR</div>
    <span>DBSCAN vs GMM — WHR 2024</span>
  </a>
  <div class="nav-links">
    <a href="/" {% if request.path=='/' %}class="active"{% endif %}>Home</a>
    <a href="/dashboard" {% if request.path=='/dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/hasil" {% if request.path=='/hasil' %}class="active"{% endif %}>Hasil Akhir</a>
    <a href="/laporan" {% if request.path=='/laporan' %}class="active"{% endif %}>Laporan</a>
    <a href="/tentang" {% if request.path=='/tentang' %}class="active"{% endif %}>Tentang</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  Amelya - 2244074 - Teknik Informatika - World Happiness Report 2024
</footer>
</body>
</html>
